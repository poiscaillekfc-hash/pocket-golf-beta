 solidBlock(x-w/2-4*sc,top-4*sc,w+8*sc,30*sc,.27);
 for(const [tip,half,depth] of [[top-64*sc,72*sc,72*sc],[top-100*sc,52*sc,66*sc]])polygonObstacle([[x,tip],[x-half,tip+depth],[x,tip+depth+7*sc],[x+half,tip+depth]],.38);
 }}}
function polygonObstacle(points,restitution=.4){
 // Circle against convex polygon: nearest edge point; if ball is inside, resolve toward nearest boundary.
 let inside=true,insideSign=0,minDist=Infinity,bestX=0,bestY=0,bestNX=0,bestNY=-1;
 for(let i=0;i<points.length;i++){const a=points[i],b=points[(i+1)%points.length],dx=b[0]-a[0],dy=b[1]-a[1];const u=clamp(((ball.x-a[0])*dx+(ball.y-a[1])*dy)/(dx*dx+dy*dy),0,1);const px=a[0]+u*dx,py=a[1]+u*dy;const dd=Math.hypot(ball.x-px,ball.y-py);if(dd<minDist){minDist=dd;bestX=px;bestY=py;}
 const cross=dx*(ball.y-a[1])-dy*(ball.x-a[0]);if(i===0){insideSign=Math.sign(cross)}else if(cross*insideSign < -0.0001)inside=false;}
 if(!inside && minDist>=R)return;
 let nx=ball.x-bestX,ny=ball.y-bestY,d=Math.hypot(nx,ny);
 if(inside){nx=bestX-ball.x;ny=bestY-ball.y;d=Math.hypot(nx,ny);if(d<.001){nx=0;ny=-1;d=1}ball.x=bestX+nx/d*(R+.25);ball.y=bestY+ny/d*(R+.25);}
 else {if(d<.001){nx=0;ny=-1;d=1}ball.x=bestX+nx/d*(R+.25);ball.y=bestY+ny/d*(R+.25);}
 collideNormal(nx/d,ny/d,restitution,.86);
}
function obstacles(l){for(let r of l.rocks){circleObstacle(r.x,r.y,r.r,.38)}for(let b of l.bridges){solidBlock(b.x,b.y,b.w,b.h,.30)}treeCollisions(l)}
function hazard(msg='Hors limites !'){const l=levels[level];ball.x=160;ball.y=safeHeight(l,160);ball.vx=ball.vy=0;ball.grounded=true;restTime=0;elapsed=0;tone(145,.15);if(shots>=3){endHole(false)}else{mode='ready';doToast(msg+' · Retour au départ')}}
function endHole(success){if(mode==='ending'||mode==='modal')return;mode='ending';ball.vx=ball.vy=0;const earned=success?4-shots:0;score+=earned;clearTimeout(transitionTimer);if(success){tone(680,.14);for(let i=0;i<34;i++){const a=i*2.399,s=70+Math.random()*170;celebration.push({x:ball.x,y:ball.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-90,life:1+Math.random()*.6,r:3+Math.random()*4,col:['#f4c54a','#ff716b','#ffffff','#17c75d'][i%4]})}}
 transitionTimer=setTimeout(()=>{if(level===levels.length-1){if(score>highScore){highScore=score;try{localStorage.setItem('pg-green-valley-best',score)}catch(e){}}modal('Monde 1 terminé','🏆','GREEN VALLEY',`Tu as terminé les 12 trous avec <b>${score}/36 points</b> !<br>${score>=28?'Excellent ! Tu as atteint le seuil de 28 points.':'Objectif du monde : 28 points. Rejoue pour améliorer ton score.'}`, 'Rejouer le monde',restart,'Revoir le dernier trou',()=>setLevel(level),`${score} / 36`)}else{const current=level;modal(success?'Trou réussi !':'Plus de coups','⛳',success?earned===3?'HOLE IN ONE !':`+${earned} POINT${earned>1?'S':''}`:'TROU MANQUÉ',success?`Balle rentrée en <b>${shots} coup${shots>1?'s':''}</b>. Total : <b>${score} pts</b>.`:`Tu as utilisé tes trois coups. Total : <b>${score} pts</b>.`,'Trou suivant →',()=>setLevel(current+1),'Rejouer ce trou',()=>setLevel(current),success?`+${earned}`:'0') }},success?820:430)
}
function step(dt){if(mode!=='flying')return;const l=levels[level];elapsed+=dt;
 // Wind only acts in the air: one arrow mild, two moderate, three strong.
 if(!ball.grounded)ball.vx+=wind*dt;
 ball.vx*=1-.000065*Math.hypot(ball.vx,ball.vy)*dt;
 ball.vy+=G*dt;
 const oldx=ball.x,oldy=ball.y;
 ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;ball.angle+=ball.vx*dt/R;
 if(ball.x< -48||ball.x>MW+48||ball.y>MH+75||ball.y< -240){hazard('Hors limites !');return}
 obstacles(l);
 const onWater=inWater(l,ball.x),g=cy(l,ball.x),m=slope(l,ball.x);
 if(onWater){const w=l.water.find(q=>ball.x>q[0]&&ball.x<q[1]);const waterY=Math.max(cy(l,w[0]),cy(l,w[1]))+13;if(ball.y+R>=waterY){hazard('Plouf !');return}}
 else if(ball.y+R>=g){
 let nx=m,ny=-1;let len=Math.hypot(nx,ny);nx/=len;ny/=len;
 // correct penetration along surface normal, retain tangential velocity
 const depth=ball.y+R-g;ball.x+=nx*Math.min(4,depth*.3);ball.y=cy(l,ball.x)-R;
 const vn=ball.vx*nx+ball.vy*ny;
 if(vn< -68){collideNormal(nx,ny,.38,.89)}else{
 const tx=1/len,ty=m/len,along=ball.vx*tx+ball.vy*ty;
 let next=along+G*ty*dt;const resist=125*dt;
 if(Math.abs(next)<resist && Math.abs(G*ty)<125){next=0}else next-=Math.sign(next)*Math.min(resist,Math.abs(next));
 ball.vx=tx*next;ball.vy=ty*next;
 }
 ball.grounded=true;
 }else ball.grounded=false;
 const cupx=l.cup,cupy=cy(l,cupx);
 if(Math.abs(ball.x-cupx)<19&&ball.y+R>=cupy-15&&ball.y+R<=cupy+19&&Math.abs(ball.vx)<255&&ball.vy<190){ball.x=cupx;ball.y=cupy-2;endHole(true);return}
 if(ball.grounded&&Math.hypot(ball.vx,ball.vy)<12)restTime+=dt;else restTime=0;
 if(restTime>.55||elapsed>14){ball.vx=ball.vy=0;ball.y=safeHeight(l,ball.x);ball.grounded=true;mode='ready';restTime=0;if(shots>=3)endHole(false);else doToast('À toi de jouer !')}
}
function path(points,fill){ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);ctx.closePath();ctx.fillStyle=fill;ctx.fill()}
function rrect(x,y,w,h,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function line(x1,y1,x2,y2,width,color){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.lineWidth=width;ctx.lineCap='round';ctx.strokeStyle=color;ctx.stroke()}
function background(){ctx.fillStyle='#36b6ed';ctx.fillRect(0,0,MW,MH);if(artwork.complete&&artwork.naturalWidth){ctx.drawImage(artwork,0,0,MW,MH)}else{ctx.fillStyle='#43b8ed';ctx.fillRect(0,0,MW,MH);path([[0,450],[160,155],[312,430],[570,90],[826,445],[985,177],[1200,440],[1200,630],[0,630]],'#259bd4')}}
function terrain(){const l=levels[level];
 const drawSoil=(offset,fill)=>{ctx.beginPath();let active=false;for(let x=0;x<=MW;x+=3){let blocked=inWater(l,x);if(!blocked){const yy=cy(l,x)+offset+Math.sin(x/104+offset)*Math.min(4,offset*.1);if(!active){ctx.moveTo(x,yy);active=true}else ctx.lineTo(x,yy)}else if(active){ctx.lineTo(x-3,MH+35);ctx.lineTo(0,MH+35);ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.beginPath();active=false;}}
 if(active){ctx.lineTo(MW,MH+35);ctx.lineTo(0,MH+35);ctx.closePath();ctx.fillStyle=fill;ctx.fill();}};
 // continuous soil, water slots are carved out afterwards using the same exact bank geometry
 let path=[];for(let x=0;x<=MW;x+=3)path.push([x,cy(l,x)]);path.push([MW,MH+30],[0,MH+30]);ctx.beginPath();ctx.moveTo(path[0][0],path[0][1]);for(const q of path.slice(1))ctx.lineTo(q[0],q[1]);ctx.closePath();ctx.fillStyle='#a55c37';ctx.fill();
 for(let k=1;k<=3;k++){ctx.beginPath();ctx.moveTo(0,cy(l,0)+k*20);for(let x=3;x<=MW;x+=3)ctx.lineTo(x,cy(l,x)+k*20+Math.sin(x/85+k)*5);ctx.lineTo(MW,MH+30);ctx.lineTo(0,MH+30);ctx.closePath();ctx.fillStyle=['','#965032','#82412c','#733928'][k];ctx.fill()}
 // Excavated pools: no soil pixels can show through the water surface.
 for(const [a,b] of l.water){
  const ya=cy(l,a),yb=cy(l,b),y=Math.min(ya,yb)-3;
  ctx.beginPath();ctx.moveTo(a-7,ya-5);ctx.quadraticCurveTo(a+4,y+1,a+15,y+3);
  ctx.lineTo(b-15,y+3);ctx.quadraticCurveTo(b-4,y+1,b+7,yb-5);
  ctx.lineTo(b+7,MH+40);ctx.lineTo(a-7,MH+40);ctx.closePath();
  ctx.fillStyle='#1789d3';ctx.fill();ctx.strokeStyle='#123c54';ctx.lineWidth=4;ctx.stroke();
  ctx.save();ctx.clip();ctx.fillStyle='#35bef0';ctx.fillRect(a-8,y,b-a+16,27);
  ctx.fillStyle='#1476bb';ctx.fillRect(a-8,y+37,b-a+16,MH-y);
  ctx.restore();
 }
 // grassy rim only along solid banks, no green line across the water
 for(const [aa,bb] of solidRanges(l)){ctx.beginPath();ctx.moveTo(aa,cy(l,aa));for(let x=aa+3;x<bb;x+=3)ctx.lineTo(x,cy(l,x));ctx.lineTo(bb,cy(l,bb));ctx.strokeStyle='#123c4f';ctx.lineWidth=24;ctx.lineJoin='round';ctx.stroke();ctx.strokeStyle='#64cd22';ctx.lineWidth=19;ctx.stroke();ctx.strokeStyle='#a3ea48';ctx.lineWidth=5;ctx.stroke();}
}
function solidRanges(l){let ranges=[],from=0;for(const [a,b] of l.water){ranges.push([from,Math.max(from,a-7)]);from=Math.min(MW,b+7)}ranges.push([from,MW]);return ranges.filter(q=>q[1]>q[0]);}
function water(){const l=levels[level];for(const [a,b] of l.water){const y=Math.max(cy(l,a),cy(l,b))+13;ctx.save();ctx.beginPath();ctx.rect(a+8,y+4,b-a-16,42);ctx.clip();for(let i=0;i<3;i++){ctx.beginPath();for(let x=a+8;x<b-8;x+=5){const yy=y+14+i*11+Math.sin(x*.055+t*(i+1)*1.5+i)*2.5;if(x===a+8)ctx.moveTo(x,yy);else ctx.lineTo(x,yy)}ctx.strokeStyle=i===0?'#dbf8fa':'#58d7fb';ctx.lineWidth=i===0?3:2;ctx.stroke()}ctx.restore()}}
function tree(tr){const sc=tr.s,x=tr.x,base=tr.base;
 const pineTier=(tip,half,depth,col,light)=>{const pts=[[x,tip],[x-half,tip+depth],[x-half*.65,tip+depth-5*sc],[x,tip+depth+7*sc],[x+half*.65,tip+depth-5*sc],[x+half,tip+depth]];ctx.beginPath();ctx.moveTo(...pts[0]);for(const p of pts.slice(1))ctx.lineTo(...p);ctx.closePath();ctx.fillStyle=col;ctx.fill();ctx.strokeStyle='#11334e';ctx.lineWidth=5*sc;ctx.lineJoin='round';ctx.stroke();path([[x,tip],[x-half*.25,tip+depth*.8],[x-half*.7,tip+depth*.83],[x,tip+depth+7*sc]],light)};
 if(tr.kind==='solid'){line(x,base,x,base-95*sc,22*sc,'#12334e');line(x,base,x,base-95*sc,13*sc,'#a96a36');
 pineTier(base-176*sc,38*sc,80*sc,'#54d316','#9ce83d');pineTier(base-136*sc,53*sc,75*sc,'#24b82b','#64da1b');pineTier(base-97*sc,64*sc,72*sc,'#0caa34','#49d52c');
 }else{const w=115*sc,h=116*sc,top=base-h,lx=x-w/2,rx=x+w/2;
 // thick hollow arch, center remains open and collision-free
 rrect(lx-2,top+34*sc,21*sc,h-32*sc,5*sc,'#11344c');rrect(rx-19*sc,top+34*sc,21*sc,h-32*sc,5*sc,'#11344c');rrect(lx+3,top+35*sc,13*sc,h-37*sc,3,'#a76534');rrect(rx-16*sc,top+35*sc,13*sc,h-37*sc,3,'#a76534');
 rrect(lx-4,top-4,w+8,30*sc,7*sc,'#12334e');rrect(lx+1,top,w-2,20*sc,6*sc,'#8b4d25');
 pineTier(top-64*sc,72*sc,72*sc,'#20b638','#71dd30');pineTier(top-100*sc,52*sc,66*sc,'#35c629','#a5e449');
 }}
function rocksAndBridges(){const l=levels[level];for(const r of l.rocks){ctx.fillStyle='#6e7e89';ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,Math.PI*2);ctx.fill();path([[r.x-r.r*.84,r.y-r.r*.37],[r.x-r.r*.27,r.y-r.r*.9],[r.x+r.r*.29,r.y-r.r*.6],[r.x+r.r*.64,r.y+r.r*.11],[r.x-r.r*.3,r.y+r.r*.42]],'#96a9b4')}
 for(const b of l.bridges){rrect(b.x,b.y,b.w,b.h,5,'#845127');for(let x=b.x+9;x<b.x+b.w;x+=23)line(x,b.y+2,x,b.y+b.h-2,2,'#c78d4e')}}
function flag(){const l=levels[level],x=l.cup,y=cy(l,x);ctx.fillStyle='#522414';ctx.beginPath();ctx.ellipse(x,y+2,22,5,0,0,Math.PI*2);ctx.fill();line(x+10,y,x+10,y-92,4,'#fffef6');path([[x+10,y-92],[x-40,y-76],[x+10,y-61]],'#ff625b');path([[x+9,y-92],[x-20,y-82],[x+9,y-79]],'#ff8c7c')}
function drawBall(){const l=levels[level];let yy=cy(l,ball.x);ctx.fillStyle='#00293329';ctx.beginPath();ctx.ellipse(ball.x,yy+5,15,4,0,0,Math.PI*2);ctx.fill();ctx.save();ctx.translate(ball.x,ball.y);ctx.rotate(ball.angle);ctx.fillStyle='#ff665f';ctx.beginPath();ctx.arc(0,0,R,0,Math.PI*2);ctx.fill();ctx.lineWidth=3.8;ctx.strokeStyle='white';ctx.stroke();ctx.fillStyle='#ffb0a7';ctx.beginPath();ctx.arc(-3,-3,2.8,0,Math.PI*2);ctx.fill();ctx.restore()}
function drawnAim(){if(!aiming||mode!=='ready')return;const dx=start.x-cursor.x,dy=start.y-cursor.y,len=Math.hypot(dx,dy),p=clamp(len/MAX_DRAG,0,1);if(len<2)return;const ux=dx/len,uy=dy/len;
 // Straight aiming line IN THE SHOOTING DIRECTION; pull goes the opposite way.
 line(ball.x+ux*16,ball.y+uy*16,ball.x+ux*185,ball.y+uy*185,5,'#ffffffd9');
 line(ball.x+ux*16,ball.y+uy*16,ball.x+ux*(35+p*110),ball.y+uy*(35+p*110),10,'#ffffff');
 // back-drag power strip, translucent track and solid orange fill
 line(ball.x-ux*19,ball.y-uy*19,ball.x-ux*145,ball.y-uy*145,17,'#24576850');
 line(ball.x-ux*19,ball.y-uy*19,ball.x-ux*(19+p*126),ball.y-uy*(19+p*126),11,p>.84?'#ff6a5b':'#ffca56');
 ctx.fillStyle='#ffffff';ctx.font='900 17px system-ui';ctx.textAlign='center';ctx.fillText(Math.round(p*100)+'%',ball.x-ux*73,ball.y-uy*73-22);ctx.textAlign='start'
}
function roundHud(){
 rrect(20,16,214,49,17,'#ffffffdc');ctx.strokeStyle='#143a58';ctx.lineWidth=2;ctx.strokeRect(20,16,214,49);ctx.fillStyle='#153952';ctx.font='950 16px system-ui';ctx.fillText(`${level+1} / 12`,37,47);ctx.font='900 17px system-ui';ctx.fillText(`${score} PTS`,126,47);
 rrect(247,16,132,49,17,'#ffffffd8');for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(272+i*40,41,10,0,Math.PI*2);ctx.fillStyle=i<3-shots?'#fa675b':'#d5e0e5';ctx.fill();ctx.strokeStyle='#173b57';ctx.lineWidth=2;ctx.stroke()}
 rrect(400,16,227,49,17,'#ffffffde');ctx.fillStyle='#153e5d';ctx.font='900 13px system-ui';ctx.fillText('VENT',416,45);
 const value=levels[level].wind;ctx.font='950 23px system-ui';ctx.fillStyle=value>0?'#138bd0':value<0?'#e56b48':'#617786';ctx.fillText(value===0?'Pas de vent':windMark(value),480,47);
 // unobtrusive control at top-right
 rrect(1105,15,75,48,16,'#ffffffdf');ctx.fillStyle='#254359';ctx.font='900 22px system-ui';ctx.fillText('Ⅱ',1133,47);
 if(aiming){rrect(425,567,350,24,12,'#143a5870');rrect(431,572,338*power,14,7,power>.86?'#ff7955':'#ffe071');ctx.textAlign='center';ctx.font='850 15px system-ui';ctx.fillStyle='#fff';ctx.fillText(`PUISSANCE  ${Math.round(power*100)} %`,600,558);ctx.textAlign='start'}
 else if(mode==='ready'){rrect(383,567,434,39,18,'#ffffffca');ctx.textAlign='center';ctx.font='850 16px system-ui';ctx.fillStyle='#194d66';ctx.fillText('Glisse vers l’arrière pour tirer',600,592);ctx.textAlign='start'}
}
function drawCelebration(dt){for(const p of celebration){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=G*.55*dt;p.life-=dt;ctx.globalAlpha=clamp(p.life,0,1);ctx.fillStyle=p.col;ctx.fillRect(p.x,p.y,p.r,p.r)}ctx.globalAlpha=1;celebration=celebration.filter(p=>p.life>0)}
function render(dt){ctx.setTransform(dpr*sx,0,0,dpr*sy,0,0);ctx.fillStyle='#86e2f2';ctx.fillRect(0,0,MW,MH);ctx.save();if(cameraShake>.02){ctx.translate((Math.random()-.5)*cameraShake,(Math.random()-.5)*cameraShake);cameraShake*=.86}background();terrain();water();rocksAndBridges();for(const tr of levels[level].trees)tree(tr);flag();drawBall();drawnAim();drawCelebration(dt);ctx.restore();roundHud()}
function loop(ms){if(!last)last=ms;const dt=Math.min(.05,(ms-last)/1000);last=ms;t+=dt;acc=Math.min(.08,acc+dt);while(acc>=STEP){step(STEP);acc-=STEP}render(dt);requestAnimationFrame(loop)}
canvas.addEventListener('click',e=>{let p=pointFromEvent(e);if(p.x>1100&&p.y>12&&p.y<70&&mode!=='intro'&&mode!=='modal'){(()=>{const resumeMode=mode;modal('Pause','⛳','PAUSE',`Trou ${level+1} sur 12. Score actuel : <b>${score} pts</b>.`,'Continuer',()=>{mode=resumeMode},'Recommencer le monde',restart)})()}});
setLevel(0);modal('BÊTA 0.4 · GREEN VALLEY','⛳','POCKET GOLF',`<b>12 trous · 3 coups chacun.</b><br>Touche l’écran, <b>glisse ton doigt vers l’arrière</b> et relâche. Le trait blanc indique la direction du tir, la barre colorée sa puissance.<br>Le vent pousse réellement la balle pendant son vol.`,`JOUER MAINTENANT`,restart,'Meilleur score : '+highScore+'/36',()=>{mode='ready'});
requestAnimationFrame(loop);
})();
