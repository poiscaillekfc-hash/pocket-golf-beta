function step(dt){if(mode!=='flying')return;const l=levels[level];elapsed+=dt;

function tree(tr){const sc=tr.s,base=tr.base,x=tr.x;if(tr.kind==='solid'){
 line(x,base,x,base-112*sc,20*sc,'#6f391e');line(x+3*sc,base-3,x+3*sc,base-110*sc,8*sc,'#9c532c');
 for(const [ox,oy,r,col] of [[-27,-105,31,'#0caa46'],[23,-109,32,'#12c354'],[0,-132,41,'#14b84f'],[-13,-143,29,'#3ddd65']]){ctx.fillStyle=col;ctx.beginPath();ctx.arc(x+ox*sc,base+oy*sc,r*sc,0,Math.PI*2);ctx.fill()}
 }else{const w=115*sc,h=116*sc,top=base-h;const lx=x-w/2,rx=x+w/2;
 // unmistakable hollow arch, real open window to fly through
 rrect(lx,top+40*sc,17*sc,h-40*sc,6*sc,'#6c361c');rrect(rx-17*sc,top+40*sc,17*sc,h-40*sc,6*sc,'#6c361c');rrect(lx,top,w,22*sc,8*sc,'#714020');
 rrect(lx+7*sc,top+38*sc,7*sc,h-43*sc,4*sc,'#9e562b');rrect(rx-14*sc,top+38*sc,7*sc,h-43*sc,4*sc,'#9e562b');
 for(const [ox,oy,r,col] of [[-43,-104,27,'#09a83e'],[40,-106,27,'#11b94c'],[0,-126,37,'#16c755'],[-20,-140,27,'#3cda63']]){ctx.fillStyle=col;ctx.beginPath();ctx.arc(x+ox*sc,base+oy*sc,r*sc,0,Math.PI*2);ctx.fill()}
 }}
function rocksAndBridges(){const l=levels[level];for(const r of l.rocks){ctx.fillStyle='#6e7e89';ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,Math.PI*2);ctx.fill();path([[r.x-r.r*.84,r.y-r.r*.37],[r.x-r.r*.27,r.y-r.r*.9],[r.x+r.r*.29,r.y-r.r*.6],[r.x+r.r*.64,r.y+r.r*.11],[r.x-r.r*.3,r.y+r.r*.42]],'#96a9b4')}
 for(const b of l.bridges){rrect(b.x,b.y,b.w,b.h,5,'#845127');for(let x=b.x+9;x<b.x+b.w;x+=23)line(x,b.y+2,x,b.y+b.h-2,2,'#c78d4e')}}
function flag(){const l=levels[level],x=l.cup,y=cy(l,x);ctx.fillStyle='#522414';ctx.beginPath();ctx.ellipse(x,y+2,22,5,0,0,Math.PI*2);ctx.fill();line(x+10,y,x+10,y-92,4,'#fffef6');path([[x+10,y-92],[x-40,y-76],[x+10,y-61]],'#ff625b');path([[x+9,y-92],[x-20,y-82],[x+9,y-79]],'#ff8c7c')}
function drawBall(){const l=levels[level];let yy=cy(l,ball.x);ctx.fillStyle='#00293329';ctx.beginPath();ctx.ellipse(ball.x,yy+5,15,4,0,0,Math.PI*2);ctx.fill();ctx.save();ctx.translate(ball.x,ball.y);ctx.rotate(ball.angle);ctx.fillStyle='#ff665f';ctx.beginPath();ctx.arc(0,0,R,0,Math.PI*2);ctx.fill();ctx.lineWidth=3.8;ctx.strokeStyle='white';ctx.stroke();ctx.fillStyle='#ffb0a7';ctx.beginPath();ctx.arc(-3,-3,2.8,0,Math.PI*2);ctx.fill();ctx.restore()}
function drawnAim(){if(!aiming||mode!=='ready')return;const dx=start.x-cursor.x,dy=start.y-cursor.y,len=Math.hypot(dx,dy),p=clamp(len/MAX_DRAG,0,1);if(len<2)return;const ux=dx/len,uy=dy/len;
 // Straight aiming line IN THE SHOOTING DIRECTION; pull goes the opposite way.
 line(ball.x+ux*16,ball.y+uy*16,ball.x+ux*185,ball.y+uy*185,5,'#ffffffd9');
 line(ball.x+ux*16,ball.y+uy*16,ball.x+ux*(35+p*110),ball.y+uy*(35+p*110),10,'#ffffff');
 // back-drag power strip, translucent track and solid orange fill
 line(ball.x-ux*19,ball.y-uy*19,ball.x-ux*145,ball.y-uy*145,17,'#24576850');
 line(ball.x-ux*19,ball.y-uy*19,ball.x-ux*(19+p*126),ball.y-uy*(19+p*126),11,p>.84?'#ff6a5b':'#ffca56');
 ctx.fillStyle='#ffffff';ctx.font='900 17px system-ui';ctx.textAlign='center';ctx.fillText(Math.round(p*100)+'%',ball.x-ux*73,ball.y-uy*73-22);ctx.textAlign='start'
}
function roundHud(){rrect(18,18,280,63,19,'#ffffffd9');ctx.fillStyle='#286677';ctx.font='950 14px system-ui';ctx.fillText('GREEN VALLEY  ·  MONDE 1',35,42);ctx.fillStyle='#315769';ctx.font='850 20px system-ui';ctx.fillText(`${String(level+1).padStart(2,'0')} / 12    •    ${score} PTS`,35,68);
 rrect(334,18,202,63,19,'#ffffffd0');ctx.font='900 12px system-ui';ctx.fillStyle='#4a8a92';ctx.fillText('COUPS RESTANTS',351,41);for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(358+i*35,62,9,0,Math.PI*2);ctx.fillStyle=i<3-shots?'#ff6e63':'#d4dfe0';ctx.fill()}
 rrect(553,18,298,63,19,'#ffffffd2');ctx.fillStyle='#347280';ctx.font='900 13px system-ui';ctx.fillText('VENT',570,42);const a=windMark(wind);ctx.font='1000 26px system-ui';ctx.fillStyle=wind===0?'#8a9da7':wind>0?'#228bc0':'#ef8056';ctx.fillText(a,632,65);ctx.fillStyle='#406d7b';ctx.font='750 12px system-ui';ctx.fillText(wind===0?'CALME':`${Math.abs(wind)} / 3  ${Math.abs(wind)===1?'LÉGER':Math.abs(wind)===2?'MODÉRÉ':'FORT'}`,732,61);
 rrect(868,18,308,63,19,'#ffffffd9');ctx.fillStyle='#356675';ctx.font='800 12px system-ui';ctx.fillText(levels[level].title.toUpperCase(),885,43);ctx.font='800 13px system-ui';ctx.fillStyle='#26836b';ctx.fillText('3 / 2 / 1 POINTS',885,65);
 // Pause and sound hit areas
 rrect(1105,100,72,43,15,'#ffffffd9');ctx.fillStyle='#346374';ctx.font='900 15px system-ui';ctx.fillText('Ⅱ',1134,128);
 rrect(1105,154,72,38,14,'#ffffffbc');ctx.font='850 14px system-ui';ctx.fillText(sound?'♪':'×',1132,179);
 if(aiming){rrect(445,554,310,25,13,'#2e64744d');rrect(449,558,302*power,17,9,power>.85?'#ff7863':'#ffe075');ctx.font='800 13px system-ui';ctx.fillStyle='#ffffff';ctx.textAlign='center';ctx.fillText(`PUISSANCE  ${Math.round(power*100)}%`,600,546);ctx.textAlign='start'}else if(mode==='ready'){rrect(381,565,440,42,19,'#ffffffaa');ctx.fillStyle='#397d88';ctx.font='800 15px system-ui';ctx.textAlign='center';ctx.fillText('Tire en arrière pour viser et doser ton tir',600,592);ctx.textAlign='start'}
}
function drawCelebration(dt){for(const p of celebration){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=G*.55*dt;p.life-=dt;ctx.globalAlpha=clamp(p.life,0,1);ctx.fillStyle=p.col;ctx.fillRect(p.x,p.y,p.r,p.r)}ctx.globalAlpha=1;celebration=celebration.filter(p=>p.life>0)}
function render(dt){ctx.setTransform(dpr*sx,0,0,dpr*sy,0,0);ctx.fillStyle='#86e2f2';ctx.fillRect(0,0,MW,MH);ctx.save();if(cameraShake>.02){ctx.translate((Math.random()-.5)*cameraShake,(Math.random()-.5)*cameraShake);cameraShake*=.86}background();terrain();water();rocksAndBridges();for(const tr of levels[level].trees)tree(tr);flag();drawBall();drawnAim();drawCelebration(dt);ctx.restore();roundHud()}
function loop(ms){if(!last)last=ms;const dt=Math.min(.05,(ms-last)/1000);last=ms;t+=dt;acc=Math.min(.08,acc+dt);while(acc>=STEP){step(STEP);acc-=STEP}render(dt);requestAnimationFrame(loop)}
canvas.addEventListener('click',e=>{let p=pointFromEvent(e);if(p.x>1098&&p.y>90&&p.y<148&&mode!=='intro'&&mode!=='modal'){(()=>{const resumeMode=mode;modal('Pause','⛳','PAUSE',`Trou ${level+1} sur 12. Score actuel : <b>${score} pts</b>.`,'Continuer',()=>{mode=resumeMode},'Recommencer le monde',restart)})()}else if(p.x>1098&&p.y>149&&p.y<196){sound=!sound;doToast(sound?'Son activé':'Son coupé')}});
setLevel(0);modal('BÊTA 0.3 · GREEN VALLEY','⛳','POCKET GOLF',`<b>12 trous · 3 coups chacun.</b><br>Touche l’écran, <b>glisse ton doigt vers l’arrière</b> et relâche. Le trait blanc indique la direction du tir, la barre colorée sa puissance.<br>Le vent pousse réellement la balle pendant son vol.`,`JOUER MAINTENANT`,restart,'Meilleur score : '+highScore+'/36',()=>{mode='ready'});
requestAnimationFrame(loop);
})();
</script></body></html>
