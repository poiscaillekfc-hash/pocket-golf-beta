function flower(x,y,size=1){line([[x,y],[x+2,y-15*size]],'#3c973f',2);for(let a=0;a<5;a++){let ang=a*6.283/5;ell(x+2+Math.cos(ang)*6*size,y-15*size+Math.sin(ang)*6*size,4*size,4*size,'#fcf1e0');}ell(x+2,y-15*size,3.5*size,3.5*size,'#edc448')}
function drawWorld(){background();
 // far and near decorations use the exact same forest, stone and soil drawing methods
 // earth is one shared terrain construction from left to right
 soil();river();
 // cottage and trees are rooted and partially occluded by the same grass and small stones
 cabin(350,ground(350)-5,.82);
 tree(266,ground(266)-6,.91);tree(836,ground(836)-8,.70);
 rock(764,ground(764)-3,.83);rock(990,ground(990)-4,.55);
 rock(433,ground(433)+17,.37);rock(625,ground(625)+11,.37);
 // add occluding tufts and flowers to break any sprite-like seams
 for(let j=0;j<43;j++){let x=(j*317+25)%W;if(isWater(x))continue;let y=ground(x)-13;ctx.save();ctx.translate(x,y);ctx.rotate(Math.sin(time*1.3+j)*.04);ell(0,0,6,4,j%3?'#69b845':'#a0d954');if(j%6===0)flower(3,1,.62);ctx.restore()}
 lily(507,630);lily(568,675);
 // Close foreground plants frame the scene, painted with the same colors and light as the playable meadow.
 polygon([[0,700],[0,660],[24,648],[48,678],[65,634],[88,670],[120,650],[152,705]],'#2e7657');
 polygon([[1142,720],[1185,663],[1202,681],[1224,642],[1247,674],[1280,648],[1280,720]],'#307c5a');
 ell(40,681,61,38,'#3d915d');ell(91,706,62,35,'#60aa59');ell(1238,696,81,45,'#438c58');
 for(const [x,y,s] of [[28,674,.95],[78,690,.72],[1243,676,.93],[1207,697,.62]])flower(x,y,s);
 // shoreline soft waterline touches the grass edge without a hard rectangle
 line([[461,555],[482,561],[508,566]],'#d8f8dc',2);line([[562,564],[594,556],[606,548]],'#b9f5e5',2);
 // lip of the cup follows sloped soil surface
 let gy=ground(HOLE_X)-11;ell(HOLE_X,gy+1,20,5,'#204e2c');ell(HOLE_X,gy,12,3,'#0d3025');line([[HOLE_X,gy],[HOLE_X,gy-69]],'#effefb',4);polygon([[HOLE_X,gy-68],[HOLE_X+35,gy-57],[HOLE_X,gy-43]],'#f25052');polygon([[HOLE_X+2,gy-67],[HOLE_X+31,gy-57],[HOLE_X+2,gy-60]],'#ff9b5c');
}
function particle(x,y,vx,vy,col,life=.5,size=3){particles.push({x,y,vx,vy,col,life,max:life,size});}
function burst(x,y,type){const colors=type==='water'?['#a8f9ea','#fffef5','#2fd5dd']:type==='win'?['#fff5a5','#fabc4d','#ff808a','#c0f66b']:['#b6db64','#f8f5c5','#c18853'];let n=type==='win'?48:12;for(let i=0;i<n;i++){let angle=rnd()*6.283,s=rnd()*(type==='win'?240:95)+12;particle(x,y,Math.cos(angle)*s,Math.sin(angle)*s-30,colors[i%colors.length],.3+rnd()*.55,2+rnd()*4)}}
function setUI(){UI.shots.textContent='COUPS : '+shots+' / 3';UI.wind.textContent=wind===0?'PAS DE VENT':('VENT : '+(wind>0?'→':'←').repeat(Math.max(1,Math.min(3,Math.round(Math.abs(wind)*3)))));UI.fill.style.width=(power*100)+'%';UI.hint.textContent=aim?'Relâche pour tirer':scene==='game'?'Glisse en arrière pour viser':'';}
function reset(){ball={x:TEE_X,y:ground(TEE_X)-R-13,vx:0,vy:0,spin:0,moving:false};shots=0;aim=null;power=0;done=false;locked=false;transition=0;particles=[];wind=.37;setUI()}
function show(title,emoji,text,primary,cb,secondary=null,secCb=null){scene='menu';UI.ov.classList.remove('hidden');UI.panel.innerHTML=`<div class="eyebrow">Pocket Golf · Bêta 0.9</div><div style="font-size:39px">${emoji}</div><h1>${title}</h1><p>${text}</p><button class="btn" id="primary">${primary}</button>${secondary?`<button class="btn secondary" id="secondary">${secondary}</button>`:''}<p class="legend">Une scène homogène · Un trou test · Aucun changement à la visée</p>`;document.getElementById('primary').onclick=cb;if(secondary)document.getElementById('secondary').onclick=secCb;}
function home(){show('POCKET GOLF','⛳','GREEN VALLEY · Un seul style cartoon pour le paysage, les arbres, la cabane, l’eau et le terrain.','JOUER ▶',worlds,'Recommencer la démo',play)}
function worlds(){scene='worlds';UI.ov.classList.remove('hidden');UI.panel.innerHTML=`<div class="eyebrow">Choisir un monde</div><h1>Les mondes 🌍</h1><div class="world"><div class="emoji">🌳</div><div style="flex:1">GREEN VALLEY<br><small>Démo graphique · 1 trou disponible</small></div><span style="color:#3b9c58">✓</span></div><div class="world lock"><div class="emoji">🏜️</div><div style="flex:1">DESERT DUNES<br><small>Bientôt disponible</small></div>🔒</div><div class="world lock"><div class="emoji">❄️</div><div style="flex:1">FROZEN PEAKS<br><small>Bientôt disponible</small></div>🔒</div><div class="world lock"><div class="emoji">🪐</div><div style="flex:1">COSMIC GOLF<br><small>Bientôt disponible</small></div>🔒</div><button class="btn" id="primary">JOUER À GREEN VALLEY ▶</button><button class="btn secondary" id="secondary">← ACCUEIL</button>`;document.getElementById('primary').onclick=play;document.getElementById('secondary').onclick=home}
function play(){reset();scene='game';UI.ov.classList.add('hidden');setUI()}
function pause(){if(scene!=='game')return;show('PAUSE','🌲','Découvre l’environnement illustré de Green Valley : chaque matériau a été redessiné avec la même palette.','REPRENDRE ▶',()=>{scene='game';UI.ov.classList.add('hidden')},'RECOMMENCER',play)}
function finish(win){if(done)return;done=true;aim=null;locked=true;if(win)burst(ball.x,ball.y,'win');transition=win?1.05:.45;setUI();resultWin=win;}let resultWin=false;
function showResult(win){let pts=win?Math.max(0,4-shots):0;show(win?'TROU RÉUSSI !':'3 COUPS UTILISÉS',win?'🏆':'⛳',win?`La balle est rentrée en <b>${shots} coup${shots>1?'s':''}</b>. <b>+${pts} points</b> ! Évalue surtout l’homogénéité du paysage.`:'Cette démo permet d’évaluer le terrain et les graphismes. Retente le passage de la rivière !','REJOUER LE TROU',play,'CHOISIR UN MONDE',worlds)}
function screen(e){const rect=canvas.getBoundingClientRect();const portrait=window.matchMedia('(orientation:portrait)').matches;return portrait?{x:(e.clientY-rect.top)*W/rect.height,y:(rect.right-e.clientX)*H/rect.width}:{x:(e.clientX-rect.left)*W/rect.width,y:(e.clientY-rect.top)*H/rect.height}}
function down(e){if(scene!=='game'||done||ball.moving||locked)return;e.preventDefault();stage.setPointerCapture?.(e.pointerId);let p=screen(e);aim={x:p.x,y:p.y,cx:p.x,cy:p.y};power=0;setUI()}
function move(e){if(!aim||scene!=='game')return;e.preventDefault();let p=screen(e);aim.cx=p.x;aim.cy=p.y;let dx=aim.x-p.x,dy=aim.y-p.y;power=clamp(Math.hypot(dx,dy)/240,0,1);setUI()}
function up(e){if(!aim||scene!=='game'||done)return;e.preventDefault();let dx=aim.x-aim.cx,dy=aim.y-aim.cy,dist=Math.hypot(dx,dy);aim=null;if(dist<13){power=0;setUI();return;}power=clamp(dist/240,0,1);const vel=330+power*710;ball.vx=dx/dist*vel;ball.vy=dy/dist*vel;ball.moving=true;locked=true;shots++;burst(ball.x,ball.y,'grass');setUI();}
function bounceRock(x,y,r){if(!ball.moving)return;let dx=ball.x-x,dy=ball.y-y,dist=Math.hypot(dx,dy),min=r+R;if(dist>min||dist<.01)return;let nx=dx/dist,ny=dy/dist;ball.x=x+nx*min;ball.y=y+ny*min;let vn=ball.vx*nx+ball.vy*ny;if(vn<0){ball.vx-=1.48*vn*nx;ball.vy-=1.48*vn*ny;burst(ball.x,ball.y,'rock')}}
function physics(dt){if(!ball.moving||done)return;let steps=4,ds=dt/steps;for(let k=0;k<steps;k++){let b=ball;const px=b.x,py=b.y;b.vy+=725*ds;b.vx+=wind*50*ds;b.x+=b.vx*ds;b.y+=b.vy*ds;b.spin+=b.vx*ds*.012;
 // tree trunks and the hut have simple, invisible contact geometry: art has no image-based collision costs
 if(b.x>246&&b.x<292&&b.y>ground(266)-100&&b.y<ground(266))bounceRock(267,ground(267)-51,21);
 if(b.x>804&&b.x<865&&b.y>ground(836)-95&&b.y<ground(836))bounceRock(834,ground(834)-46,18);
 if(b.x>302&&b.x<388&&b.y>ground(350)-144&&b.y<ground(350)-8){let edge=px<302?302:px>388?388:Math.abs(b.x-302)<Math.abs(b.x-388)?302:388;if(Math.abs(b.x-edge)<R+3){b.x=edge+(px<edge?-R-3:R+3);b.vx*=-.52;burst(b.x,b.y,'rock')}}
 bounceRock(764,ground(764)-30,35);bounceRock(990,ground(990)-25,22);
 if(isWater(b.x)){if(b.y>568){burst(b.x,567,'water');b.moving=false;b.vx=b.vy=0;if(shots>=3)finish(false);else{ball.x=TEE_X;ball.y=ground(TEE_X)-R-13;ball.moving=false;locked=false;}break;}}
 else {let floor=ground(b.x)-R-13;if(b.y>=floor&&b.vy>0){b.y=floor;if(Math.abs(b.vy)>85){b.vy=-b.vy*.43;b.vx*=.90;burst(b.x,b.y+7,'grass')}else{b.vy=0;b.vx*=Math.exp(-4.4*ds);if(Math.abs(b.vx)<5)b.vx=0;}}}
 // generous bounded cup acceptance, evaluated continuously so high-speed steps aren't skipped
 if(Math.abs(b.x-HOLE_X)<22&&Math.abs(b.y-(ground(HOLE_X)-R-13))<17&&Math.hypot(b.vx,b.vy)<620){b.x=HOLE_X;b.y=ground(HOLE_X)-R-7;b.vx=b.vy=0;b.moving=false;finish(true);break;}
 if(b.x>W+70||b.x<-70||b.y>H+80||b.y<-140){b.moving=false;if(shots>=3)finish(false);else{ball.x=TEE_X;ball.y=ground(TEE_X)-R-13;ball.moving=false;locked=false;}break;}
 if(b.vy===0&&b.vx===0){b.moving=false;locked=false;break;}
 }
 // after a stroke ball stops, the user may take another stroke; water/out needs reset but consumes stroke
 if(!done&&!ball.moving&&shots>=3){finish(false);} }
function animate(dt){time+=dt;for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.life-=dt;if(p.life<=0){particles.splice(i,1);continue;}p.vy+=390*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;}if(transition>0){transition-=dt;if(transition<=0){transition=0;showResult(resultWin)}}}
function ballDraw(){if(!ball)return;let b=ball;let shadowY=ground(b.x);if(!isWater(b.x))ell(b.x,shadowY-9,16,5,'#27543a6e');ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.spin);ell(0,0,R+1,R+1,'#32677c55');ell(-1,-2,R,R,'#fafff3');ell(-3,-5,4,3,'#ffffff');for(let [x,y] of [[2,-2],[-4,2],[3,5],[-6,-3]])ell(x,y,2,1.2,'#b9d3da');ctx.restore();}
function aimDraw(){if(!aim||!ball||power===0)return;const dx=aim.x-aim.cx,dy=aim.y-aim.cy,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L;let len=70+power*164;ctx.save();ctx.strokeStyle='#174c596e';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(ball.x+ux*14+3,ball.y+uy*14+4);ctx.lineTo(ball.x+ux*len+3,ball.y+uy*len+4);ctx.stroke();ctx.strokeStyle='#ffffff';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(ball.x+ux*14,ball.y+uy*14);ctx.lineTo(ball.x+ux*len,ball.y+uy*len);ctx.stroke();ell(ball.x+ux*len,ball.y+uy*len,5,5,'#ffffff');ctx.restore();}
function drawParticles(){for(const p of particles){ctx.save();ctx.globalAlpha=clamp(p.life/p.max,0,1);ell(p.x,p.y,p.size,p.size*.68,p.col);ctx.restore()}}
function loop(timestamp){if(!last)last=timestamp;const dt=clamp((timestamp-last)/1000,0,.035);last=timestamp;animate(dt);if(scene==='game')physics(dt);seed=11;ctx.save();ctx.scale(canvas.width/W,canvas.height/H);drawWorld();if(ball){ballDraw();aimDraw();}drawParticles();ctx.restore();requestAnimationFrame(loop)}
stage.addEventListener('pointerdown',down);stage.addEventListener('pointermove',move);stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',()=>{aim=null;power=0;setUI()});document.getElementById('pause').onclick=pause;window.addEventListener('blur',()=>{if(scene==='game'&&ball&&!ball.moving)pause()});reset();home();requestAnimationFrame(loop);
})();</script></body></html>
